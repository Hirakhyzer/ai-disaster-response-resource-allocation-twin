[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-disaster-response-resource-allocation-twin"
version = "0.1.0"
description = "Independent synthetic disaster-response resource allocation digital twin"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hirakhyzer" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
